<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFlex - Smart Jobs. Flexible Future.</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="app-container">
    <!-- Desktop Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo-icon">CF</div>
        <div>
          <div class="brand-title">CampusFlex</div>
          <div class="brand-tagline">Smart Jobs. Flexible Future.</div>
        </div>
      </div>
      <ul class="nav-list" id="sidebar-nav">
        <!-- Populated dynamically based on user role -->
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <h2 id="page-title" style="font-size: 20px; font-weight: 800;">Dashboard</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <!-- Notification Bell -->
          <button id="notification-btn" class="btn" style="background: transparent; border: 1px solid var(--border-color); padding: 8px 12px; position: relative;">
            🔔 <span id="notif-count-badge" style="background: var(--danger-red); color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; display: none;">0</span>
          </button>
          
          <!-- User Profile & Auth Button -->
          <div id="user-nav-area">
            <button class="btn btn-primary" onclick="showAuthModal('login')">Log In / Register</button>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Body -->
      <div class="content-wrapper" id="main-view-container">
        <!-- Dynamic Views Injected Here -->
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobile-nav">
    <a href="#" class="mobile-nav-item active" onclick="navigateTo('dashboard')">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="#" class="mobile-nav-item" onclick="navigateTo('find-jobs')">
      <span>🔍</span>
      <span>Jobs</span>
    </a>
    <a href="#" class="mobile-nav-item" onclick="navigateTo('timetable')">
      <span>📅</span>
      <span>Schedule</span>
    </a>
    <a href="#" class="mobile-nav-item" onclick="navigateTo('messages')">
      <span>💬</span>
      <span>Messages</span>
    </a>
    <a href="#" class="mobile-nav-item" onclick="navigateTo('profile')">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Auth Modal Dialog -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="auth-modal-title" style="font-size: 20px; font-weight: 800;">Welcome to CampusFlex</h3>
        <button onclick="closeModal('auth-modal')" style="background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
      </div>

      <!-- Quick Demo Account Switcher -->
      <div style="background: var(--light-purple); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 12px;">
        <div style="font-weight: 700; color: var(--primary-purple); margin-bottom: 6px;">⚡ Demo One-Click Login:</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-secondary" style="font-size: 11px; padding: 4px 8px;" onclick="demoLogin('student@campusflex.com', 'Student123!')">Student (Ananya)</button>
          <button class="btn btn-secondary" style="font-size: 11px; padding: 4px 8px;" onclick="demoLogin('brightacademy@campusflex.com', 'Employer123!')">Employer (Bright Academy)</button>
          <button class="btn btn-secondary" style="font-size: 11px; padding: 4px 8px;" onclick="demoLogin('admin@campusflex.com', 'Admin123!')">Admin</button>
        </div>
      </div>

      <!-- Auth Form Container -->
      <div id="auth-form-container"></div>
    </div>
  </div>

  <!-- Job Details Modal -->
  <div class="modal-overlay" id="job-modal">
    <div class="modal-card" id="job-modal-body"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/timetable.js"></script>
  <script src="/js/jobs.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
