# CampusFlex Production Configuration (MySQL / Cloud)

server.port=${PORT:8080}
spring.application.name=campusflex

# Production MySQL Database Connection via Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusflex?useSSL=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# HikariCP Connection Pool Optimization for Production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Disable H2 console in production for security
spring.h2.console.enabled=false

# SQL Schema Initialization (Set to 'never' if managed via Liquibase/Flyway in production)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging level for production
logging.level.root=WARN
logging.level.com.campusflex=INFO
