server.port=8080
spring.application.name=campusflex

# H2 Database in MySQL compatibility mode for local zero-config execution
spring.datasource.url=jdbc:h2:mem:campusflexdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console enable for easy inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auto-initialize database using schema.sql and data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.com.campusflex=DEBUG
logging.level.org.springframework.jdbc=INFO
